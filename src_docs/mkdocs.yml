# this_file: src_docs/mkdocs.yml
site_name: vexy-markliff
site_description: Convert Markdown and HTML to XLIFF and back, from the command line or from Python.
site_url: https://vexy.dev/vexy-markliff/
repo_url: https://github.com/vexyart/vexy-markliff
repo_name: vexyart/vexy-markliff
edit_uri: edit/main/src_docs/md/
docs_dir: md
site_dir: ../docs
use_directory_urls: true
theme:
  name: materialx
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle: {icon: material/brightness-7, name: Switch to dark mode}
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle: {icon: material/brightness-4, name: Switch to light mode}
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.tasklist: {custom_checkbox: true}
plugins:
  - search
nav:
  - Home: index.md
  - Installation: installation.md
  - Quick start: quickstart.md
  - Command line: cli.md
  - Python API: api.md
  - XLIFF output: output-format.md
  - Architecture: architecture.md
  - Troubleshooting: troubleshooting.md
  - Contributing: contributing.md
  - Design notes:
      - Overview: design/index.md
      - XLIFF 2.1 primer: design/xliff-primer.md
      - HTML mapping rules: design/html-rules.md
      - Markdown mapping rules: design/markdown-rules.md
      - Sentence segmentation: design/segmentation.md
      - Libraries and tools: design/tools.md
      - Sample files: design/samples.md
